<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 147 36" width="147" height="36" role="img">
<title>Open to work</title>
<style>
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
