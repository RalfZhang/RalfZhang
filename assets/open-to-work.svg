<circle cx="21" cy="18" r="4.5" fill="#fff"/>
<text x="34" y="23" textLength="96" lengthAdjust="spacingAndGlyphs" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Open to work</text>
</svg>
